[workspace]
resolver = "2"
members = ["tm-core", "tm"]
# tm-kernel-ffi is a PATH DEPENDENCY of `tm`, not a member: it stays its own
# cargo workspace on purpose (it drives `lake` and links the Lean runtime;
# kernel/README.md, AGENTS §2.2). Once `tm` depends on it by path, cargo
# insists the separation be spelled out here — two workspace roots may not
# nest silently.
exclude = ["kernel/tm-kernel-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
notify = "7"
ical = "0.11"
ureq = "2"
insta = { version = "1", features = ["yaml", "json"] }
proptest = "1"
tempfile = "3"
regex = "1"

[profile.dev]
opt-level = 1
